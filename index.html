<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header">
        <h1>WeatherMap</h1>
        <h3>Discover the weather anywhere in the world.</h3>
    </header>
    <main id="main">
        <form id="search-form">
            <label for="location-input" class="visually-hidden">Enter a city or location</label>
            <input type="text" id="location-input" name="location" placeholder="Enter city name" required>
            <button type="submit">Get Weather</button>
        </form>
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Loading ...</p>
        </div>
        <div id="error-container" class="hidden">
            <p>Error: <span id="error-message"></span></p>
            <button id="ok-button">OK</button>
        </div>
        <div id="map"></div>
    </main>
    <footer>
        <p>&copy; 2024 WeatherMap. All rights reserved.</p>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
